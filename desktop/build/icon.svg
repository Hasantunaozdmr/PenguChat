      <stop offset="0" stop-color="#1fc9bf"/>
      <stop offset="1" stop-color="#0a7c77"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
  </defs>
  <!-- zemin -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
