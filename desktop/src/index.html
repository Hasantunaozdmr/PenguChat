<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>PengusChat — Twitch + Kick</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand" id="brand">🐧 Pengus<span>Chat</span></div>

    <form id="linkForm" class="linkbar">
      <span class="dot twitch-dot"></span><span class="dot kick-dot"></span>
      <input id="linkInput" placeholder="Twitch veya Kick linkini yapıştır…" title="Linki yapıştırınca chat kendiliğinden doğru panelde açılır. Düz kanal adı yazarsan iki platformda da açılır." spellcheck="false" autocomplete="off" />
      <button type="submit" class="btn primary">Aç</button>
    </form>
    <span id="linkHint" class="hint"></span>

    <div class="spacer"></div>

    <button id="delayTag" class="delay-tag hidden" title="Twitch ile Kick yayını arasındaki yaklaşık gecikme farkı. Tıkla: hemen yeniden ölç."></button>
    <button id="updateBtn" class="btn update hidden"></button>

    <div class="group">
      <button id="toggleTwitch" class="btn chip twitch active" title="Twitch panelini göster/gizle">Twitch</button>
      <button id="toggleKick" class="btn chip kick active" title="Kick panelini göster/gizle">Kick</button>
    </div>
    <div class="group">
      <button id="reportBtn" class="btn icon" title="Sorun bildir">🐞<span id="reportDot" class="dot-new hidden"></span></button>
      <button id="inboxBtn" class="btn icon hidden" title="Gelen sorunlar">📥<span id="inboxBadge" class="badge hidden"></span></button>
      <button id="modToggle" class="btn icon hidden" title="Mod araçları (timeout / ban) aç / kapat">👤</button>
      <button id="layoutBtn" class="btn icon" title="Yan yana / Alt alta">⇆</button>
      <button id="swapBtn" class="btn icon" title="Panellerin yerini değiştir">⇄</button>
      <button id="menuBtn" class="btn icon" title="Diğer">⋯</button>
    </div>

    <div id="menu" class="menu hidden">
      <button data-action="reload-all">Her iki chat'i yenile <kbd>F5</kbd></button>
      <button data-action="check-update">Güncellemeleri kontrol et <kbd id="versionLabel"></kbd></button>
      <button data-action="logout">Tüm hesaplardan çıkış yap</button>
    </div>
  </header>

  <div id="modbar" class="modbar hidden">
    <span class="mb-icon">👤</span>
    <input id="modUser" placeholder="Chat'te bir kullanıcı adına tıkla" spellcheck="false" autocomplete="off" />
    <button id="modClear" class="btn mini" title="Seçimi temizle">✕</button>
    <span class="mb-sep"></span>
    <button id="tgtTwitch" class="btn chip twitch" title="Twitch'te uygula">Twitch</button>
    <button id="tgtKick" class="btn chip kick" title="Kick'te uygula">Kick</button>
    <span class="mb-sep"></span>
    <button id="toBtn" class="btn mod" title="Seçili kullanıcıya timeout at">⏱ Timeout</button>
    <input id="toSecs" type="number" min="1" max="1209600" title="Timeout süresi (saniye)" />
    <span class="mb-unit">sn</span>
    <button id="banBtn" class="btn mod danger" title="Seçili kullanıcıyı banla">⛔ Ban</button>
    <span id="modHint" class="hint"></span>
  </div>

  <main id="panes" class="panes horizontal">
    <section class="pane" id="pane-twitch" data-platform="twitch">
      <div class="pane-head">
        <span class="dot"></span>
        <strong>Twitch</strong>
        <span class="chan"></span>
        <span class="viewers" title="Yayının anlık izleyici sayısı"></span>
        <span class="status"></span>
        <div class="spacer"></div>
        <button class="btn mini" data-act="chat" title="Chat'e geri dön / yenile">⟳</button>
        <button class="btn mini" data-act="zoom-out" title="Yazıyı küçült">A−</button>
        <button class="btn mini" data-act="zoom-in" title="Yazıyı büyüt">A+</button>
      </div>
      <div class="pane-body">
        <div class="placeholder">Yukarıdan bir Twitch kanalı gir.</div>
      </div>
    </section>

    <div id="splitter" class="splitter"></div>

    <section class="pane" id="pane-kick" data-platform="kick">
      <div class="pane-head">
        <span class="dot"></span>
        <strong>Kick</strong>
        <span class="chan"></span>
        <span class="viewers" title="Yayının anlık izleyici sayısı"></span>
        <span class="status"></span>
        <div class="spacer"></div>
        <button class="btn mini" data-act="chat" title="Chat'e geri dön / yenile">⟳</button>
        <button class="btn mini" data-act="zoom-out" title="Yazıyı küçült">A−</button>
        <button class="btn mini" data-act="zoom-in" title="Yazıyı büyüt">A+</button>
      </div>
      <div class="pane-body">
        <div class="placeholder">Yukarıdan bir Kick kanalı gir.</div>
      </div>
    </section>
  </main>

  <div id="reportDlg" class="dlg-wrap hidden">
    <div class="dlg">
      <div class="dlg-head">
        <div class="tabs"><button class="tab active" data-tab="new">🐞 Sorun bildir</button><button class="tab" data-tab="mine">📋 Bildirdiklerim<span id="mineDot" class="dot-new hidden"></span></button></div>
        <div class="spacer"></div><button class="btn mini" data-close>✕</button></div>
      <div id="tabNew" class="tab-body">
        <p class="dlg-note">Ne oldu? Ne yaparken oldu? Ne kadar ayrıntı yazarsan o kadar çabuk düzeltilir.</p>
        <textarea id="reportText" maxlength="2000" placeholder="Örn: Kick chat'i açılmıyor, siyah ekran kalıyor…"></textarea>
        <input id="reportContact" readonly tabindex="-1" title="Kullanıcı adın, giriş yaptığın Twitch / Kick hesabından otomatik alınır" />
        <div class="dlg-foot"><span id="reportHint" class="hint"></span><div class="spacer"></div><button id="reportSend" class="btn primary">Gönder</button></div>
      </div>
      <div id="tabMine" class="tab-body inbox mine hidden"></div>
    </div>
  </div>

  <div id="inboxDlg" class="dlg-wrap hidden">
    <div class="dlg wide">
      <div class="dlg-head"><div class="tabs" id="inboxTabs"><button class="tab active" data-itab="reports">📥 Sorunlar</button><button class="tab" data-itab="log">📜 Log</button><button class="tab" data-itab="mod">🛡️ Mod log</button><button class="tab" data-itab="stats">📊 İstatistik</button><button class="tab" data-itab="roles">👥 Yetkiler</button></div><span id="inboxCount" class="hint"></span><div class="spacer"></div>
        <button id="inboxRefresh" class="btn mini" title="Yenile">⟳</button>
        <button id="inboxLogout" class="btn mini" title="Bu bilgisayarda yönetici girişini kapat">Çıkış</button>
        <button class="btn mini" data-close>✕</button></div>
      <div id="inboxList" class="inbox"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
