name: PenguLive - iPhone derleme kontrolü

# iPhone sürümünün derlenip derlenmediğini kontrol eder (Apple hesabı gerekmez, imzasız simülatör derlemesi).
# Hiçbir şey yayınlamaz; Apple hesabı açılınca TestFlight'a gönderme buraya eklenecek.
on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ios-check.yml"
  workflow_dispatch:

concurrency:
  group: penguchat-ios-check
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Kurulu Xcode sürümleri
        working-directory: .
        run: ls -d /Applications/Xcode*.app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci --no-audit --no-fund
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - run: npx expo prebuild --platform ios --no-install
      - name: pod install
        working-directory: mobile/ios
        run: |
          for i in 1 2 3; do pod install && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - name: xcodebuild (simülatör, imzasız)
        working-directory: mobile/ios
        # HaishinKit Xcode 26 ister; Expo'nun kendi kodu da en yeni (beta) derleyicide hata verebiliyor.
        # Kurulu 26.x sürümlerini yeniden eskiye dener, ilk derleyende durur.
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          CANDS=$( (ls -d /Applications/Xcode_26.2*.app; ls -d /Applications/Xcode_26*.app | grep -v "26\.2") 2>/dev/null | grep -vi beta | head -4)
          [ -z "$CANDS" ] && CANDS=$(ls -d /Applications/Xcode_*.app | sort -Vr | head -1)
          for X in $CANDS; do
            echo "::group::Deneniyor: $X"
            sudo xcode-select -s "$X/Contents/Developer"
            xcodebuild -version
            rm -rf ~/Library/Developer/Xcode/DerivedData
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
            grep -E "error:" build.log | sort -u | head -40 || true
            echo "::endgroup::"
            if grep -q "BUILD SUCCEEDED" build.log; then echo "✅ DERLENDİ: $X"; exit 0; fi
            echo "❌ $X ile derlenmedi"
          done
          exit 1
      - name: Hata ayrıntısı
        if: failure()
        working-directory: mobile/ios
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true
