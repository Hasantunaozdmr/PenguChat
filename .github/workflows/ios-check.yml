name: PenguLive - iPhone derleme kontrolü

# iPhone sürümünü derler (Apple hesabı gerekmez, imzasız): simülatör (Appetize) + gerçek iPhone (.ipa, Sideloadly).
# Apple Developer hesabı açılınca TestFlight'a gönderme buraya eklenecek.
on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ios-check.yml"
  workflow_dispatch:

concurrency:
  group: penguchat-ios-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Kurulu Xcode sürümleri
        working-directory: .
        run: ls -d /Applications/Xcode*.app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci --no-audit --no-fund
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - run: npx expo prebuild --platform ios --no-install
      - name: pod install
        working-directory: mobile/ios
        run: |
          for i in 1 2 3; do pod install && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - name: xcodebuild (simülatör, imzasız)
        working-directory: mobile/ios
        # HaishinKit Xcode 26 ister; Expo'nun kendi kodu (expo-modules-jsi) en yeni derleyiciyi ister.
        # Kurulu 26.x sürümlerini yeniden eskiye dener, ilk derleyende durur.
        # Release: JavaScript uygulamanın içine gömülür (simülatörde tek başına açılabilsin)
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          CANDS=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -3)
          [ -z "$CANDS" ] && CANDS=$(ls -d /Applications/Xcode_*.app | sort -Vr | head -1)
          for X in $CANDS; do
            echo "::group::Deneniyor: $X"
            sudo xcode-select -s "$X/Contents/Developer"
            xcodebuild -version
            rm -rf dd
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
            grep -E "error:" build.log | sort -u | head -40 || true
            echo "::endgroup::"
            if grep -q "BUILD SUCCEEDED" build.log; then echo "✅ DERLENDİ: $X"; echo "XCODE_OK=$X" >> "$GITHUB_ENV"; exit 0; fi
            echo "❌ $X ile derlenmedi"
          done
          exit 1
      - name: Hata ayrıntısı
        if: failure()
        working-directory: mobile/ios
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      # 📱 Sanal iPhone'da (iOS Simülatörü) aç, ekran görüntüsü al, çöktü mü bak
      - name: Simülatörde aç
        working-directory: mobile/ios
        run: |
          APP=$(ls -d dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "Uygulama: $APP"
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          xcrun simctl launch "$DEV" "$BID"
          sleep 25
          xcrun simctl io "$DEV" screenshot shots/1-acilis.png
          sleep 20
          xcrun simctl io "$DEV" screenshot shots/2-45sn.png
          # Uygulama hâlâ açık mı (çökmediyse süreç yaşıyor)
          if xcrun simctl spawn "$DEV" launchctl list | grep -q "$BID"; then echo "✅ Uygulama açık, çökmedi" | tee shots/durum.txt; else echo "❌ Uygulama kapanmış (çökmüş olabilir)" | tee shots/durum.txt; fi
          xcrun simctl spawn "$DEV" log show --last 2m --style compact --predicate 'process == "'"$SCHEME"'"' > shots/log.txt 2>&1 || true
          tail -60 shots/log.txt || true
      # 🌐 Appetize.io (tarayıcıda sanal iPhone) için: simülatör uygulamasını sabit bir linke koy
      #    https://github.com/<depo>/releases/download/iphone-sim/PenguLive-simulator.zip
      - name: Simülatör dosyasını yayınla (Appetize için)
        working-directory: mobile/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dd/Build/Products/Release-iphonesimulator
          APP=$(ls -d *.app | head -1)
          zip -qry "$GITHUB_WORKSPACE/PenguLive-simulator.zip" "$APP"
          cd "$GITHUB_WORKSPACE"
          gh release view iphone-sim >/dev/null 2>&1 || gh release create iphone-sim --prerelease --latest=false \
            --title "iPhone simülatör (test)" \
            --notes "Sadece test için: appetize.io'ya yüklenecek sanal iPhone sürümü. Gerçek iPhone'a kurulmaz."
          gh release upload iphone-sim PenguLive-simulator.zip --clobber
          echo "İndir: https://github.com/${GITHUB_REPOSITORY}/releases/download/iphone-sim/PenguLive-simulator.zip"
      # 📲 Gerçek iPhone'a kurulacak dosya (.ipa, imzasız). Windows'ta Sideloadly kendi Apple ID'nle imzalayıp
      #    kabloyla telefona kurar. Sabit link:
      #    https://github.com/<depo>/releases/download/iphone-test/PenguLive.ipa
      - name: Gerçek iPhone dosyası (.ipa)
        working-directory: mobile/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo xcode-select -s "$XCODE_OK/Contents/Developer"
          WS=$(ls -d *.xcworkspace | head -1)
          rm -rf ddev
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath ddev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build-dev.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build-dev.log; then grep -n -B2 -A6 "error:" build-dev.log | head -150; exit 1; fi
          APP=$(ls -d ddev/Build/Products/Release-iphoneos/*.app | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/PenguLive.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/PenguLive.ipa"
          cd "$GITHUB_WORKSPACE"
          gh release view iphone-test >/dev/null 2>&1 || gh release create iphone-test --prerelease --latest=false \
            --title "iPhone test sürümü (Sideloadly)" \
            --notes "Gerçek iPhone'a test için: Windows'ta Sideloadly ile kendi Apple ID'nle kurulur. Ücretsiz Apple ID ile 7 gün geçerli."
          gh release upload iphone-test PenguLive.ipa --clobber
          echo "İndir: https://github.com/${GITHUB_REPOSITORY}/releases/download/iphone-test/PenguLive.ipa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator
          path: mobile/ios/shots/
          if-no-files-found: ignore
