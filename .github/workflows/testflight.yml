name: PenguLive - iPhone TestFlight

# iPhone sürümünü Apple hesabıyla imzalayıp TestFlight'a gönderir.
# Gerekenler (GitHub → Settings → Secrets → Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (App Store Connect API anahtarı). Anahtarlar sadece bu adımda geçici bir dosyaya yazılır.
on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: penguchat-testflight
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEAM_ID: K49Q56B89R

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - run: npx expo prebuild --platform ios --no-install
      - name: pod install
        working-directory: mobile/ios
        run: |
          for i in 1 2 3; do pod install && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1

      - name: Xcode seç
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -Vr | head -1)
          echo "Xcode: $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: API anahtarı (geçici dosya)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_ISSUER_ID" ]; then echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 eksik"; exit 1; fi
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" || { echo "::error::ASC_KEY_P8 içeriği beklenen biçimde değil (BEGIN PRIVATE KEY yok)"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Sürüm numarası
        working-directory: mobile/ios
        run: |
          PLIST=$(ls */Info.plist | grep -v Pods | head -1)
          BUILD=$((1000 + ${{ github.run_number }}))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Info.plist: $PLIST · build $BUILD · sürüm $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

      - name: Arşivle (imzalı)
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PenguLive.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KID" -authenticationKeyIssuerID "$ASC_ISS" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 || { grep -n -B2 -A8 "error:" archive.log | head -150; tail -40 archive.log; exit 1; }
          tail -5 archive.log

      - name: TestFlight'a gönder
        working-directory: mobile/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PenguLive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KID" -authenticationKeyIssuerID "$ASC_ISS" \
            > export.log 2>&1 || { grep -n -i -B2 -A8 "error" export.log | head -150; tail -40 export.log; exit 1; }
          tail -15 export.log
          echo "✅ TestFlight'a gönderildi. Apple işleyince (10-30 dk) TestFlight'ta görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
