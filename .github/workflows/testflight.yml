name: PenguLive - iPhone TestFlight

# iPhone sürümünü Apple hesabıyla imzalayıp TestFlight'a gönderir.
# Gerekenler (GitHub → Settings → Secrets → Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (App Store Connect API anahtarı). Anahtarlar sadece bu adımda geçici bir dosyaya yazılır.
# Şimdilik sadece elle çalıştırılır (TestFlight davetleri Apple tarafında takılı; iPhone kurulumu iphone-adhoc.yml ile)
on:
  workflow_dispatch:

concurrency:
  group: penguchat-testflight
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEAM_ID: K49Q56B89R

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1
      - run: npx expo prebuild --platform ios --no-install
      - name: pod install
        working-directory: mobile/ios
        run: |
          for i in 1 2 3; do pod install && exit 0; echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30; done; exit 1

      - name: Xcode seç
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -Vr | head -1)
          echo "Xcode: $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: API anahtarı (geçici dosya)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_ISSUER_ID" ]; then echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 eksik"; exit 1; fi
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" || { echo "::error::ASC_KEY_P8 içeriği beklenen biçimde değil (BEGIN PRIVATE KEY yok)"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # Saklanan sertifikanın şifresi (API anahtarından türetilir, kayıtlarda gizlenir)
          CP=$(printf '%s' "$ASC_KEY_P8" | shasum -a 256 | cut -d' ' -f1)
          echo "::add-mask::$CP"
          echo "CERT_PASS=$CP" >> "$GITHUB_ENV"

      - name: Kayıtlı sertifika (önbellek)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cert-store
          key: dist-cert-${{ github.run_id }}
          restore-keys: dist-cert-

      - name: Sürüm numarası
        working-directory: mobile/ios
        run: |
          PLIST=$(ls */Info.plist | grep -v Pods | head -1)
          BUILD=$((1000 + ${{ github.run_number }}))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Info.plist: $PLIST · build $BUILD · sürüm $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

      - name: İmzala ve TestFlight'a gönder (fastlane)
        run: |
          which fastlane || brew install fastlane
          fastlane --version | tail -1
          fastlane beta
          echo "✅ TestFlight'a gönderildi. Apple işleyince (10-30 dk) TestFlight'ta görünür."
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

      - name: Yeni sertifika var mı
        id: newcert
        if: always()
        run: '[ -f "$RUNNER_TEMP/cert-store/new" ] && echo "yes=1" >> "$GITHUB_OUTPUT" || true'

      - name: Yeni sertifikayı sakla (şifreli)
        if: always() && steps.newcert.outputs.yes == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cert-store
          key: dist-cert-${{ github.run_id }}

      - name: Derleme kaydı (hata olursa)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/buildlog/*.log; do [ -f "$f" ] && { echo "== $f"; grep -n -B2 -A6 "error:" "$f" | head -120; tail -30 "$f"; }; done || true

      - name: Anahtarı sil
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/cert-work"
          security delete-keychain ci-db 2>/dev/null || true
