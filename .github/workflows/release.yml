name: PenguChat - Release

# main'e her gönderimde Windows + Android derlenir ve herkese açık Releases sayfasına
# (giriş gerektirmeden) yüklenir. Uygulamalar yeni sürümü buradan bulur.
on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "mobile/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: penguchat-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Her derleme yeni bir sürüm numarası alır, uygulamalar bunu görünce "Güncelle" gösterir.
  # 2.0.x: eski depodaki 1.1.x sürümlerinden büyük olmalı.
  VERSION: 2.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
      - run: npm run dist:win
      - name: Collect
        shell: bash
        run: |
          ls dist
          mkdir -p out
          cp dist/PenguChat-Setup.exe dist/PenguChat-Setup.exe.blockmap dist/latest.yml out/
          cat out/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/out/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Set version
        run: |
          node -e "
            const fs = require('fs');
            const p = 'app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.version = process.env.VERSION;
            // Eski depodaki sürüm kodlarından (100+) büyük olmalı, yoksa Android üstüne kurmaz
            j.expo.android.versionCode = 1000 + Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
            console.log(j.expo.version, j.expo.android.versionCode);
          "
      - run: npx expo prebuild --platform android --no-install
      - working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/PenguChat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PengusChat ${{ env.VERSION }}
          make_latest: true
          body: |
            ## 🐧 PengusChat: Twitch + Kick chat tek pencerede

            | | İndir |
            |---|---|
            | 🪟 **Windows** | [PenguChat-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/PenguChat-Setup.exe) |
            | 🤖 **Android** | [PenguChat.apk](https://github.com/${{ github.repository }}/releases/latest/download/PenguChat.apk) |

            **Windows:** "Windows kişisel bilgisayarınızı korudu" uyarısı çıkarsa **Ek bilgi → Yine de çalıştır** de (uygulama imzasız olduğu için normal).
            **Android:** APK'yı açınca telefon "bilinmeyen kaynaklar" izni isterse izin ver.

            **Kullanım:** Üstteki çubuğa Twitch veya Kick yayın linkini yapıştır. Chat'lerin içindeki **Giriş yap** ile hesabına bir kez gir.
            Twitch'te Google ile giriş çalışmaz, kullanıcı adı ve şifre kullan. Kurduktan sonra güncellemeler uygulamanın içinden gelir.
          files: files/*
