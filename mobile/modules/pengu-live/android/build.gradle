plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pengulive'
version = '0.1.0'

android {
  namespace "expo.modules.pengulive"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// RootEncoder (açık kaynak, Apache 2.0): kamera + mikrofon → RTMP/RTMPS, aynı anda birden çok yere
repositories {
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation "com.github.pedroSG94.RootEncoder:library:2.8.2"
}
